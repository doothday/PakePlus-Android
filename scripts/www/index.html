<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231E9BF5'/%3E%3Cpath d='M7 12.5l3.2 3.2L17 9' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>PlayTask</title>
<style>
  :root{
    --primary:#1E9BF5;
    --bg:#F4F6F8;
    --card:#FFFFFF;
    --text:#263238;
    --sub:#8A9BA5;
    --line:#ECEFF1;
    --chip-text:#546E7A;
    --red:#E53935;
    --danger:#F44336;
  }
  /* 夜间模式 */
  body.dark{
    --primary:#42A5F5;
    --bg:#12181C;
    --card:#1E262B;
    --text:#ECEFF1;
    --sub:#8FA6B0;
    --line:#2E383E;
    --chip-text:#A7BCC6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    max-width:520px;margin:0 auto;display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }

  /* ===== 顶部栏 ===== */
  header{
    background:linear-gradient(180deg,#2AA7F7 0%,#1E9BF5 100%);
    color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  header .title{font-size:23px;font-weight:700;letter-spacing:.5px;}
  header .head-right{display:flex;align-items:center;gap:12px;}
  header .coin-pill{font-size:14px;font-weight:600;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;}
  header .add-btn{
    width:34px;height:34px;border:none;background:transparent;color:#fff;
    font-size:28px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }

  /* ===== 任务分类 Tab ===== */
  .tabs{background:var(--card);display:flex;border-bottom:1px solid var(--line);flex-shrink:0;}
  .tab{
    flex:1;text-align:center;padding:15px 0 13px;font-size:15.5px;color:var(--chip-text);cursor:pointer;
    border-bottom:3px solid transparent;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;
  }
  .tab.active{color:var(--primary);font-weight:600;border-bottom-color:var(--primary);}

  /* ===== 标签筛选条 ===== */
  .tag-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;background:var(--card);flex-shrink:0;
    border-bottom:1px solid var(--line);scrollbar-width:none;}
  .tag-bar::-webkit-scrollbar{display:none;}
  .tag-chip{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--chip-text);font-size:13.5px;
    font-family:inherit;border-radius:15px;padding:6px 13px;cursor:pointer;white-space:nowrap;}
  .tag-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* ===== 表单内标签快捷选择 ===== */
  .tag-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .tag-picker .chip{font-size:13px;border:1px solid var(--line);border-radius:14px;padding:5px 12px;
    background:var(--card);color:var(--chip-text);cursor:pointer;font-family:inherit;}
  .tag-picker .chip.on{background:#E8F4FE;color:var(--primary);border-color:#BBDDF5;}

  /* ===== 完成 / 兑换 动画 ===== */
  .task-row .check{transition:background .15s,border-color .15s,transform .12s;}
  .task-row .check:active{transform:scale(.88);}
  .task-row .check.checked{background:var(--primary);border-color:var(--primary);}
  .task-row .check.checked svg{display:block;animation:checkPop .32s cubic-bezier(.34,1.56,.64,1);}
  @keyframes checkPop{0%{transform:scale(.2);}55%{transform:scale(1.3);}100%{transform:scale(1);}}
  .task-row.done-out{animation:rowFadeOut .3s ease forwards;}
  @keyframes rowFadeOut{to{opacity:0;transform:translateX(44px) scale(.96);}}
  @keyframes flashPulse{0%{background:var(--card);}35%{background:rgba(30,155,245,.14);}100%{background:var(--card);}}
  .coin-float{position:fixed;z-index:80;font-weight:700;color:var(--primary);pointer-events:none;
    font-size:18px;animation:coinFloat .85s cubic-bezier(.22,.61,.36,1) forwards;}
  .coin-float.minus{color:var(--danger);}
  @keyframes coinFloat{
    0%{opacity:0;transform:translateY(6px) scale(.8);}
    18%{opacity:1;transform:translateY(0) scale(1.08);}
    32%{transform:translateY(-6px) scale(1);}
    100%{opacity:0;transform:translateY(-52px) scale(.96);}
  }

  .list-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);}

  /* ===== 任务行 ===== */
  .task-row{display:flex;flex-wrap:nowrap;align-items:center;padding:18px 18px;border-bottom:1px solid var(--line);gap:14px;}
  .task-row .check{
    width:26px;height:26px;border:2px solid var(--sub);border-radius:6px;flex-shrink:0;
    background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .task-row .check svg{width:16px;height:16px;stroke:#fff;display:none;}
  .task-main{flex:1 1 auto;width:0;min-width:0;cursor:pointer;transition:opacity .12s;}
  .task-main:active{opacity:.7;}
  .task-title{font-size:17px;color:var(--text);word-break:break-all;line-height:1.35;}
  .task-meta{font-size:13px;color:var(--sub);margin-top:4px;}
  .task-tag{display:inline-block;font-size:12px;color:var(--primary);background:#E8F4FE;border-radius:4px;padding:1px 7px;margin-left:6px;}
  .task-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;flex-shrink:0;}
  .task-coins{color:var(--primary);font-size:17px;font-weight:600;white-space:nowrap;}
  .move-group{display:none;flex-direction:column;gap:1px;}
  .list-wrap.sorting .move-group{display:flex;}
  .move-btn{background:none;border:none;cursor:pointer;color:var(--sub);padding:0 3px;display:flex;align-items:center;}
  .move-btn:active{color:var(--primary);}
  .move-btn svg{width:15px;height:15px;fill:currentColor;}

  /* ===== 奖励行 ===== */
  .reward-row{display:flex;flex-wrap:nowrap;align-items:center;padding:18px;border-bottom:1px solid var(--line);gap:14px;cursor:pointer;}
  .sorting .reward-row{cursor:default;}
  .reward-main{flex:1 1 auto;width:0;min-width:0;cursor:pointer;}
  .reward-title{font-size:17px;line-height:1.35;word-break:break-all;}
  .reward-meta{font-size:13px;color:var(--sub);margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .reward-cost{color:var(--danger);font-size:17px;font-weight:600;white-space:nowrap;}
  .reward-cost.disabled{color:var(--sub);opacity:.6;}
  .reward-main{cursor:pointer;transition:opacity .12s;}
  .reward-main:active{opacity:.65;}
  .reward-row.redeem-flash{animation:flashPulse .5s ease,rowPop .3s ease;}
  @keyframes rowPop{0%{transform:scale(1);}45%{transform:scale(1.025);}100%{transform:scale(1);}}

  .empty-tip{text-align:center;color:var(--sub);padding:80px 20px;font-size:15px;line-height:1.8;}

  /* ===== 成果墙（左右两个独立列，各自紧凑堆叠，互不拉扯高度） ===== */
  .wall-wrap{flex:1;overflow-y:auto;background:var(--bg);padding:14px;}
  .wall-grid{display:flex;gap:14px;align-items:flex-start;}
  .wall-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px;}
  .wall-card{
    background:var(--card);border-radius:12px;padding:12px;cursor:pointer;position:relative;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
    break-inside:avoid;min-width:0;
  }
  .wall-card .tape{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:58px;height:18px;background:rgba(189,225,255,.75);border-radius:2px;
  }
  .wall-time{font-size:12.5px;color:var(--sub);margin-bottom:8px;padding-right:26px;}
  .wall-card img{width:100%;border-radius:8px;display:block;height:auto;}
  .wall-text{font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap;}
  .wall-card .wall-text.only{padding:6px 2px;}
  .wall-bottom{margin-top:8px;}
  .wall-more{
    position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;
    color:var(--sub);padding:4px;display:flex;border-radius:6px;z-index:2;
  }
  .wall-more svg{width:18px;height:18px;fill:currentColor;}

  /* ===== 成果操作菜单 ===== */
  .action-sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:150;display:none;}
  .action-sheet.show{display:block;}
  .action-sheet .sheet-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1;}
  .action-sheet .sheet-body{position:relative;z-index:2;background:var(--card);border-radius:18px 18px 0 0;padding:10px 16px 24px;}
  .action-item{display:block;width:100%;background:none;border:none;font-family:inherit;font-size:17px;
    padding:16px;text-align:center;border-bottom:1px solid var(--line);cursor:pointer;}
  .action-item.danger{color:var(--danger);}
  .action-cancel{margin-top:10px;background:var(--bg);border-radius:12px;}

  /* ===== 历史记录列表 ===== */
  .hist-row{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);}
  .hist-main{flex:1 1 auto;width:0;min-width:0;}
  .hist-title{font-size:16px;color:var(--text);word-break:break-all;line-height:1.35;}
  .hist-meta{font-size:12.5px;color:var(--sub);margin-top:4px;}
  .hist-coins{font-size:15px;font-weight:600;white-space:nowrap;flex-shrink:0;}
  .hist-coins.plus{color:var(--primary);}
  .hist-coins.minus{color:var(--danger);}
  .hist-undo{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--primary);font-size:13px;
    font-family:inherit;padding:7px 13px;border-radius:16px;cursor:pointer;}
  .hist-empty{text-align:center;color:var(--sub);padding:50px 10px;font-size:15px;line-height:1.8;}

  /* ===== 长期目标（整宽单列卡片） ===== */
  .goal-wrap{flex:1;overflow-y:auto;background:var(--bg);padding:16px 14px;}
  .goal-card{
    position:relative;border-radius:18px;padding:18px 18px 16px;margin-bottom:16px;
    box-shadow:0 1px 5px rgba(0,0,0,.07);cursor:pointer;
  }
  .goal-card.c0{background:#FDECEA;} .goal-card.c1{background:#ECEFFD;}
  .goal-card.c2{background:#F3EEFC;} .goal-card.c3{background:#FDF1E3;}
  .goal-card.c4{background:#ECF5EC;} .goal-card.c5{background:#E8F4F6;}
  .goal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .goal-title{font-size:18px;font-weight:700;color:#263238;line-height:1.35;word-break:break-all;flex:1;min-width:0;}
  .goal-more{background:none;border:none;cursor:pointer;color:#78909C;padding:4px;flex-shrink:0;border-radius:6px;}
  .goal-more svg{width:19px;height:19px;fill:currentColor;}
  .goal-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:13.5px;color:#546E7A;}
  .goal-tag{display:inline-block;font-size:12px;background:rgba(255,255,255,.65);color:#455A64;border-radius:5px;padding:2px 9px;margin-right:8px;}
  .goal-deadline{color:#546E7A;}
  .goal-deadline.overdue{color:var(--danger);}
  .goal-count{font-weight:600;color:#263238;white-space:nowrap;}
  .goal-bar{margin-top:13px;height:14px;border-radius:8px;background:rgba(255,255,255,.6);overflow:hidden;position:relative;}
  .goal-bar-fill{height:100%;border-radius:8px;transition:width .3s;}
  .goal-card.c0 .goal-bar-fill{background:#F48B8B;} .goal-card.c1 .goal-bar-fill{background:#8B9DF4;}
  .goal-card.c2 .goal-bar-fill{background:#B39DF0;} .goal-card.c3 .goal-bar-fill{background:#F4B26B;}
  .goal-card.c4 .goal-bar-fill{background:#8FCF9B;} .goal-card.c5 .goal-bar-fill{background:#7FC8D4;}
  .goal-bar-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#fff;}
  .goal-bar-pct.low{color:#546E7A;}
  .goal-empty{text-align:center;color:var(--sub);padding:90px 20px;font-size:15px;line-height:1.9;}

  /* ===== 底部导航 ===== */
  footer{background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 0 12px;flex-shrink:0;}
  .nav-item{flex:1;text-align:center;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--sub);}
  .nav-item .nav-ico{width:25px;height:25px;margin:0 auto 3px;fill:var(--sub);}
  .nav-item.active{color:var(--primary);}
  .nav-item.active .nav-ico{fill:var(--primary);}
  .nav-item .nav-label{font-size:13px;}

  /* ===== 撤销条 ===== */
  .undo-bar{
    position:fixed;left:0;right:0;bottom:70px;max-width:520px;margin:0 auto;
    background:#37474F;color:#fff;display:none;align-items:center;gap:12px;
    padding:13px 18px;z-index:60;
  }
  .undo-bar.show{display:flex;}
  .undo-bar .undo-btn{
    background:none;border:none;color:#FFD54F;font-size:15px;font-weight:600;cursor:pointer;
    font-family:inherit;padding:6px 8px;display:flex;align-items:center;gap:5px;flex-shrink:0;
  }
  .undo-bar .undo-text{font-size:14px;flex:1;text-align:right;}

  /* ===== 设置面板 ===== */
  .panel{flex:1;overflow-y:auto;background:var(--card);padding:18px;display:none;}
  .panel.show{display:block;}
  .panel h2{font-size:18px;margin:18px 0 12px;}
  .panel h2:first-child{margin-top:0;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:14px;color:var(--chip-text);;margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;
    background:var(--card);color:var(--text);
  }
  .field textarea{min-height:90px;resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
  .btn{width:100%;padding:14px;border:none;border-radius:8px;background:var(--primary);color:#fff;
    font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin:8px 0;}
  .btn.ghost{background:var(--card);color:var(--primary);border:1px solid var(--primary);}
  .btn.danger{background:var(--card);color:var(--danger);border:1px solid var(--danger);}
  .rule-box{background:var(--bg);border-radius:10px;padding:14px;font-size:13.5px;color:var(--chip-text);line-height:1.9;}
  .rule-box b{color:var(--text);}
  .status-line{font-size:13px;color:var(--sub);margin:8px 0;word-break:break-all;}

  /* ===== 设置分段选择器 ===== */
  .seg-row{display:flex;gap:8px;}
  .seg-row button{flex:1;padding:11px 0;border:1px solid var(--line);background:var(--card);color:var(--chip-text);
    font-family:inherit;font-size:14.5px;border-radius:10px;cursor:pointer;}
  .seg-row button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

  /* ===== 弹窗 ===== */
  .modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  .modal-mask.show{display:flex;}
  .modal{background:var(--card);border:0;outline:none;box-sizing:border-box;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:22px 20px 30px;max-height:85vh;overflow-y:auto;}
  .modal-title{font-size:19px;font-weight:700;margin-bottom:18px;}
  .modal .row2{display:flex;gap:12px;}
  .modal .row2 .field{flex:1;}
  .modal .del-link{display:block;text-align:center;color:var(--danger);font-size:15px;margin-top:14px;background:none;border:none;cursor:pointer;font-family:inherit;}
  .preview-box{margin:10px 0;}
  .preview-box img{max-width:100%;border-radius:10px;display:block;}

  /* ===== 大图查看 ===== */
  .lightbox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.93);display:none;z-index:300;}
  .lightbox.show{display:flex;flex-direction:column;}
  .lightbox .lb-close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.15);border:none;
    color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;z-index:2;}
  .lightbox .lb-body{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:50px 18px;}
  .lightbox .lb-body img{max-width:100%;max-height:100%;object-fit:contain;}
  .lightbox .lb-text{color:#fff;font-size:18px;line-height:1.8;white-space:pre-wrap;word-break:break-word;}

  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(38,50,56,.92);
    color:#fff;font-size:14px;padding:10px 18px;border-radius:22px;z-index:400;display:none;max-width:85%;text-align:center;}
  .toast.show{display:block;}

  /* ===== 居中确认弹窗 ===== */
  .confirm-mask{align-items:center;opacity:0;transition:opacity .18s ease;}
  .confirm-mask.show{opacity:1;}
  .confirm-box{background:var(--card);width:86%;max-width:380px;border-radius:18px;padding:24px 20px 10px;
    animation:confirmIn .22s cubic-bezier(.34,1.4,.64,1);}
  @keyframes confirmIn{0%{opacity:0;transform:scale(.9) translateY(14px);}100%{opacity:1;transform:scale(1) translateY(0);}}
  .confirm-title{font-size:19px;font-weight:700;color:var(--text);margin-bottom:12px;}
  .confirm-text{font-size:15.5px;color:var(--chip-text);line-height:1.6;word-break:break-all;}
  .confirm-actions{display:flex;justify-content:flex-end;gap:20px;padding:18px 0 10px;}
  .confirm-actions button{background:none;border:none;font-family:inherit;font-size:16px;cursor:pointer;padding:8px 10px;}
  .confirm-actions .cancel{color:var(--chip-text);}
  .confirm-actions .ok{color:var(--primary);font-weight:600;}


  /* ===== 字体大小档位 ===== */
  body.font-sm .tab{font-size:14px;}
  body.font-sm .task-title,body.font-sm .reward-title{font-size:15px;}
  body.font-sm .task-meta,body.font-sm .reward-meta{font-size:12px;}
  body.font-sm .task-coins{font-size:15px;}
  body.font-lg .tab{font-size:16.5px;}
  body.font-lg .task-title,body.font-lg .reward-title{font-size:18.5px;}
  body.font-lg .task-meta,body.font-lg .reward-meta{font-size:13.5px;}
  body.font-lg .task-coins{font-size:18.5px;}
  body.font-lg .goal-title{font-size:19.5px;}

  /* ===== 夜间模式专项适配 ===== */
  body.dark header{background:linear-gradient(180deg,#1E6FB0 0%,#1760A0 100%);}
  body.dark .tag-picker .chip.on{background:rgba(30,155,245,.16);border-color:rgba(66,165,245,.5);}
  body.dark .goal-card{box-shadow:0 1px 5px rgba(0,0,0,.35);}
  body.dark .wall-card{box-shadow:0 1px 4px rgba(0,0,0,.4);}
  body.dark .task-tag{background:rgba(66,165,245,.16);}

  @media (min-width:768px){ body{max-width:480px;} }
</style>
</head>
<body>

<!-- ===== 顶部栏 ===== -->
<header>
  <div class="title">PlayTask</div>
  <div class="head-right">
    <div class="coin-pill" id="coinTotal">金币 0</div>
    <button class="add-btn" id="histBtn" onclick="openHistory()" aria-label="历史记录" style="display:none">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/><polyline points="8 12 11 15 16 10"/></svg>
    </button>
    <button class="add-btn" id="sortBtn" onclick="toggleSortMode()" aria-label="排序" style="display:none">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 6h18v2H3V6zm4 5h10v2H7v-2zm4 5h6v2h-6v-2z"/></svg>
    </button>
    <button class="add-btn" id="headAdd" aria-label="新增">＋</button>
  </div>
</header>

<!-- ===== 视图：任务 ===== -->
<div id="view-tasks" style="display:flex;flex-direction:column;flex:1;min-height:0;">
  <div class="tabs" id="tabBar">
    <button class="tab active" data-type="daily">每日任务</button>
    <button class="tab" data-type="weekly">每周任务</button>
    <button class="tab" data-type="normal">普通任务</button>
    <button class="tab" data-type="dungeon">副本任务</button>
  </div>
  <div class="tag-bar" id="tagBar"></div>
  <div class="list-wrap" id="taskList"></div>
</div>

<!-- ===== 视图：奖励 ===== -->

<script>
/* ============================================================
   状态
   ============================================================ */
const LOCAL_KEY = 'topic_workbench_state_v2';
const DAV_KEY = 'topic_workbench_dav_v1';
const APPEAR_KEY = 'topic_workbench_appearance_v1';
let state = { coins:0, tasks:[], archive:[], rewards:[], achievements:[], history:[], goals:[] };
let currentType = 'daily';
let currentTag = '全部';   // 任务页标签筛选，'全部' 表示不筛选
let currentNav = 'tasks';
let editingId = null;       // 任务
let editingRewardId = null;
let undoStack = [];
let saveTimer = null;
let pendingAchImage = null;
let sortMode = false;   // 排序模式：开启后才显示上下移按钮

const TYPE_NAME = { daily:'每日任务', weekly:'每周任务', normal:'普通任务', dungeon:'副本任务' };

/* ---------- 时间基准：凌晨 2 点为新的一天 / 一周 ---------- */
function dayKey(d=new Date()){
  const x = new Date(d);
  if(x.getHours() < 2) x.setDate(x.getDate()-1);
  return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();
}
function weekKey(d=new Date()){
  const x = new Date(d);
  if(x.getHours() < 2) x.setDate(x.getDate()-1);
  const day = (x.getDay()+6)%7;
  x.setDate(x.getDate()-day);
  return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();
}

/* ---------- 本地读写（图片较多时 localStorage 可能超限，做兜底） ---------- */
function loadLocal(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(raw) state = Object.assign({coins:0,tasks:[],archive:[],rewards:[],achievements:[],history:[],goals:[]}, JSON.parse(raw));
  }catch(e){ console.warn(e); }
}
function persistLocal(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }
  catch(e){ toast('本地空间不足，仅云端保存'); }
  scheduleCloudSave();
}

function resetDueTasks(){
  const dk = dayKey(), wk = weekKey();
  state.tasks.forEach(t=>{
    if(t.type==='daily' && t.done && t.dayKey !== dk){ t.done=false; t.doneCount=0; t.dayKey=dk; t.weekKey=wk; }
    if(t.type==='weekly' && t.done && t.weekKey !== wk){ t.done=false; t.doneCount=0; t.dayKey=dk; t.weekKey=wk; }
  });
}

/* ---------- 外观：主题 / 字体大小（设备本地偏好，不随业务数据同步） ---------- */
let appearance = { theme:'light', font:'md' };
function loadAppearance(){
  try{
    const raw = localStorage.getItem(APPEAR_KEY);
    if(raw) appearance = Object.assign({theme:'light',font:'md'}, JSON.parse(raw));
  }catch(e){}
}
function persistAppearance(){ localStorage.setItem(APPEAR_KEY, JSON.stringify(appearance)); }
function applyAppearance(){
  document.body.classList.toggle('dark', appearance.theme==='dark');
  document.body.classList.remove('font-sm','font-md','font-lg');
  document.body.classList.add('font-'+appearance.font);
  document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.theme===appearance.theme));
  document.querySelectorAll('#fontSeg button').forEach(b=>b.classList.toggle('on', b.dataset.font===appearance.font));
}
function setTheme(v){ appearance.theme=v; persistAppearance(); applyAppearance(); }
function setFont(v){ appearance.font=v; persistAppearance(); applyAppearance(); }

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function fmtTime(ts){
  const d=new Date(ts);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ============================================================
   渲染
   ============================================================ */
function renderCoin(){ document.getElementById('coinTotal').textContent = '金币 ' + state.coins; }

function allTags(){
  const s = new Set();
  state.tasks.forEach(t=>{ if(t.tag) s.add(t.tag.trim()); });
  state.goals.forEach(g=>{ if(g.tag) s.add(g.tag.trim()); });
  state.rewards.forEach(r=>{ if(r.tag) s.add(r.tag.trim()); });
  return [...s];
}
/* 弹窗内已有标签快捷点选 */
function renderTagPicker(inputId, pickerId){
  const input = document.getElementById(inputId), box = document.getElementById(pickerId);
  if(!box) return;
  const tags = allTags();
  if(tags.length===0){ box.innerHTML=''; return; }
  box.innerHTML = tags.map(tg=>
    `<button type="button" class="chip ${input.value.trim()===tg?'on':''}" data-tag="${esc(tg)}">${esc(tg)}</button>`
  ).join('');
}
function bindTagPicker(inputId, pickerId){
  const box = document.getElementById(pickerId), input = document.getElementById(inputId);
  if(!box||!input) return;
  box.addEventListener('click', e=>{
    const chip = e.target.closest('.chip'); if(!chip) return;
    input.value = chip.dataset.tag;
    renderTagPicker(inputId, pickerId);
  });
}
function visibleTasks(){
  return state.tasks.filter(t=>t.type===currentType && !t.done &&
    (currentTag==='全部' || (t.tag && t.tag.trim()===currentTag)));
}

function renderTasks(){
  // 标签筛选条
  const tagBar = document.getElementById('tagBar');
  const tags = allTags();
  tagBar.innerHTML = ['全部', ...tags].map(tg=>
    `<button class="tag-chip ${tg===currentTag?'active':''}" data-tag="${esc(tg)}">${esc(tg)}</button>`
  ).join('');
  const list = document.getElementById('taskList');
  const rows = visibleTasks();
  if(rows.length===0){
    list.innerHTML = '<div class="empty-tip">当前分类暂无任务<br>点右上角 ＋ 添加第一个任务</div>';
    return;
  }
  list.innerHTML = rows.map((t,i)=>`
    <div class="task-row" data-id="${t.id}">
      <div class="check" data-action="check">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="task-main" data-action="edit">
        <div class="task-title">${esc(t.title)}${t.tag?`<span class="task-tag">${esc(t.tag)}</span>`:''}</div>
        <div class="task-meta">${t.doneCount}/${t.count}</div>
      </div>
      <div class="task-right">
        <span class="task-coins">+${t.coins}</span>
        <div class="move-group">
          <button class="move-btn" ${i===0?'disabled style="opacity:.25"':''} data-action="up" aria-label="上移">
            <svg viewBox="0 0 24 24"><path d="M12 8l-6 6h12z"/></svg>
          </button>
          <button class="move-btn" ${i===rows.length-1?'disabled style="opacity:.25"':''} data-action="down" aria-label="下移">
            <svg viewBox="0 0 24 24"><path d="M12 16l-6-6h12z"/></svg>
          </button>
        </div>
      </div>
    </div>`).join('');
  list.classList.toggle('sorting', sortMode);
}

function renderRewards(){
  const list = document.getElementById('rewardList');
  const rows = state.rewards;
  if(rows.length===0){
    list.innerHTML = '<div class="empty-tip">还没有奖励<br>点右上角 ＋ 写下想兑换的东西</div>';
    return;
  }
  list.innerHTML = rows.map((r,i)=>{
    const enough = state.coins >= r.cost;
    return `
    <div class="reward-row" data-id="${r.id}">
      <div class="reward-main" data-action="redeem-ask">
        <div class="reward-title">${esc(r.title)}${r.tag?`<span class="task-tag">${esc(r.tag)}</span>`:''}</div>
        <div class="reward-meta">
          <span>${(r.times||0)}/${r.repeatable?'∞':'1'}</span>
        </div>
      </div>
      <span class="reward-cost ${enough?'':'disabled'}">-${r.cost}</span>
      <div class="move-group">
        <button class="move-btn" ${i===0?'disabled style="opacity:.25"':''} data-action="up" aria-label="上移">
          <svg viewBox="0 0 24 24"><path d="M12 8l-6 6h12z"/></svg>
        </button>
        <button class="move-btn" ${i===rows.length-1?'disabled style="opacity:.25"':''} data-action="down" aria-label="下移">
          <svg viewBox="0 0 24 24"><path d="M12 16l-6-6h12z"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
  list.classList.toggle('sorting', sortMode);
}

function renderWall(){
  const list = document.getElementById('wallList');
  const rows = state.achievements.slice().sort((a,b)=>b.time-a.time);
  if(rows.length===0){
    list.innerHTML = '<div class="empty-tip" style="padding-top:100px;">成果墙还是空的<br>点右上角 ＋ 记录这一刻</div>';
    return;
  }
  // 按卡片 ID 哈希生成稳定随机倾斜，左右方向随意、角度略有差异
  const hashAngle = id=>{
    let h=0; for(const ch of String(id)){ h=(h*31+ch.charCodeAt(0))>>>0; }
    const sign = h%2===0?-1:1;
    const deg = 1.0 + (h%10)/10*1.2;
    return sign*deg;
  };
  const cardHtml = a=>`
    <div class="wall-card" style="transform:rotate(${hashAngle(a.id).toFixed(1)}deg)" onclick="openLightbox('${a.id}')">
      <div class="tape"></div>
      <button class="wall-more" onclick="event.stopPropagation();openAchSheet('${a.id}')" aria-label="更多操作">
        <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
      </button>
      <div class="wall-time">${fmtTime(a.time)}</div>
      ${a.image?`<img src="${a.image}" alt="成果照片">`:''}
      ${a.text?`<div class="wall-text ${a.image?'wall-bottom':''}">${esc(a.text)}</div>`:''}
    </div>`;
  const colA=[], colB=[];
  rows.forEach((a,i)=>{ (i%2===0?colA:colB).push(cardHtml(a)); });
  list.innerHTML = `<div class="wall-grid">
    <div class="wall-col">${colA.join('')}</div>
    <div class="wall-col">${colB.join('')}</div>
  </div>`;
}

function goalPct(g){ return g.target>0 ? Math.min(100, g.current/g.target*100) : 0; }
function fmtGoalCurrent(g){
  if(g.mode==='time'){
    return `${(g.current/60).toFixed(1)} / ${(g.target/60)} 小时`;
  }
  return `${g.current} / ${g.target} 次`;
}
function fmtDeadline(ts){
  if(!ts) return '无截止';
  const diff = ts - Date.now();
  if(diff<=0) return '已截止';
  const day = Math.floor(diff/86400000);
  if(day>=1) return `剩余 ${day} 天`;
  const hr = Math.max(1, Math.ceil(diff/3600000));
  return `剩余 ${hr} 小时`;
}

    const pct = Math.round(goalPct(g));
    const overdue = g.deadline && g.deadline<Date.now();
    return `<div class="goal-card c${i%6}" onclick="openGoalSheet('${g.id}')">
      <div class="goal-top">

        <button class="goal-more" onclick="event.stopPropagation();openGoalSheet('${g.id}')" aria-label="更多操作">

function spawnCoinFloat(x, y, text, minus){

function toggleDone(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  const rowEl = document.querySelector(`.task-row[data-id="${id}"]`);
  const coinEl = rowEl ? rowEl.querySelector('.task-coins') : null;
  t.doneCount++;
  state.coins += Number(t.coins)||0;
  // 按标签联动长期目标：次数型 +1，时长型累加任务分钟数
  const goalGain = [];
  if(t.tag){
    state.goals.forEach(g=>{
      if(g.tag && g.tag.trim()===t.tag.trim()){
        const amount = g.mode==='time' ? (Number(t.durationMin)||0) : 1;
        if(amount>0){
          g.current += amount;
          goalGain.push({goalId:g.id, amount});
        }
      }
    });
  }
  const record = {
    kind:'task',
    taskId:t.id, addedCoins:Number(t.coins)||0,
    beforeCount:t.doneCount-1, archived:false, snapshot:JSON.parse(JSON.stringify(t)),
    goalGain
  };
  if(t.doneCount >= t.count){
    t.done = true;
    t.dayKey = dayKey(); t.weekKey = weekKey();
    if(t.type==='normal' || t.type==='dungeon'){
      state.archive.push(t);
      state.tasks = state.tasks.filter(x=>x.id!==t.id);
      record.archived = true;
    }
  }
  record.id = uid(); record.time = Date.now();
  state.history.unshift(record);
  if(state.history.length>100) state.history.pop();
  undoStack.push(record);
  if(undoStack.length>20) undoStack.shift();
  showUndoBar();
  persistLocal();
  // 完成动画：勾选弹跳 + 金币飘出；整组完成则整行淡出
  if(rowEl){
    const check = rowEl.querySelector('.check');
    if(check) check.classList.add('checked');
    const anchor = (coinEl||rowEl).getBoundingClientRect();
    spawnCoinFloat(anchor.left, anchor.top - 4, '+' + t.coins, false);
    if(t.done) rowEl.classList.add('done-out');
  }
  setTimeout(()=>render(), t.done?300:130);
}

/* 通用撤销一条记录（最近快速撤销 / 历史列表撤销共用） */
function undoRecord(r){
  if(!r) return;
  if(r.kind === 'reward'){
    state.coins += r.refundCoins;
    const rr = state.rewards.find(x=>x.id===r.rewardId);
    if(rr){ rr.times = r.beforeTimes; }
    else { state.rewards.push(r.snapshot); }
  }else{
    state.coins = Math.max(0, state.coins - r.addedCoins);
    // 回退本次完成累加的目标进度
    (r.goalGain||[]).forEach(gg=>{
      const g = state.goals.find(x=>x.id===gg.goalId);
      if(g) g.current = Math.max(0, g.current - gg.amount);
    });
    const t = r.snapshot;
    t.doneCount = r.beforeCount;
    t.done = false;
    if(r.archived){
      state.archive = state.archive.filter(x=>x.id!==t.id);
      state.tasks.push(t);
    }else{
      const exist = state.tasks.find(x=>x.id===t.id);
      if(exist) Object.assign(exist,t);
      else state.tasks.push(t);
    }
  }
  state.history = state.history.filter(x=>x.id!==r.id);
  undoStack = undoStack.filter(x=>x.id!==r.id);
  persistLocal(); render();
  if(undoStack.length===0){ hideUndoBar(); } else { showUndoBar(); }
}

function undoLast(){
  const r = undoStack.pop();
  if(!r) return;
  undoRecord(r);
  hideUndoBar();
  toast('已撤销');
}

/* ---------- 任务上下排序 ---------- */
function moveTask(id, dir){
  const visible = state.tasks.filter(t=>t.type===currentType && !t.done);
  const i = visible.findIndex(x=>x.id===id);
  const j = i + dir;
  if(i<0 || j<0 || j>=visible.length) return;
  const a = state.tasks.indexOf(visible[i]);
  const b = state.tasks.indexOf(visible[j]);
  [state.tasks[a], state.tasks[b]] = [state.tasks[b], state.tasks[a]];
  persistLocal(); renderTasks();
}

/* ---------- 奖励上下排序 ---------- */
function moveReward(id, dir){
  const i = state.rewards.findIndex(x=>x.id===id);
  const j = i + dir;
  if(i<0 || j<0 || j>=state.rewards.length) return;
  [state.rewards[i], state.rewards[j]] = [state.rewards[j], state.rewards[i]];
  persistLocal(); renderRewards();
}

(function bindSwipe(){
  const el = document.getElementById('taskList');

  el.addEventListener('touchstart', e=>{
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;

function askRedeem(id){
  const r = state.rewards.find(x=>x.id===id);
  if(!r) return;
  if(state.coins < r.cost){ toast('金币不足，先去完成任务'); return; }
  showConfirm({

    text:`确定花费 ${r.cost} 点成就来满足你的奖励「${r.title}」？`,
    okText:'确定',

  });

function redeemReward(id){
  const r = state.rewards.find(x=>x.id===id);
  if(!r) return;
  if(state.coins < r.cost){ toast('金币不足，先去完成任务'); return; }
  const rowEl = document.querySelector(`.reward-row[data-id="${id}"]`);
  const costEl = rowEl ? rowEl.querySelector('.reward-cost') : null;
  const snapshot = JSON.parse(JSON.stringify(r));
  state.coins -= r.cost;
  r.times = (r.times||0)+1;
  const record = {
    kind:'reward', rewardId:r.id, refundCoins:r.cost, beforeTimes:snapshot.times||0,
    snapshot:snapshot
  };
  const oneShot = !r.repeatable;
  if(oneShot){ state.rewards = state.rewards.filter(x=>x.id!==id); }
  record.id = uid(); record.time = Date.now();
  state.history.unshift(record);
  if(state.history.length>100) state.history.pop();
  undoStack.push(record);
  if(undoStack.length>20) undoStack.shift();
  showUndoBar();
  persistLocal();
  // 兑换动画：扣币飘字；单次淡出移除，不限次脉冲高亮
  if(rowEl){
    const anchor = (costEl||rowEl).getBoundingClientRect();
    spawnCoinFloat(anchor.left, anchor.top - 4, '-' + r.cost, true);
    if(oneShot){ rowEl.classList.add('done-out'); }
    else { rowEl.classList.add('redeem-flash'); }
  }
  setTimeout(()=>render(), oneShot?300:450);
  toast('兑换成功，享受奖励');
}

  document.getElementById('aText').value='';
  document.getElementById('aCamera').value='';
  document.getElementById('aAlbum').value='';
  document.getElementById('aPreview').style.display='none';
  document.getElementById('aPreview').innerHTML='';
  document.getElementById('achModalTitle').textContent='记录成果';
  document.getElementById('achModal').classList.add('show');
}
function openAchEditorForEdit(id){
  const a = state.achievements.find(x=>x.id===id);
  if(!a) return;
  editingAchId = id;
  pendingAchImage = a.image || null;
  document.getElementById('aText').value = a.text||'';
  document.getElementById('aCamera').value='';
  document.getElementById('aAlbum').value='';
  const pv = document.getElementById('aPreview');
  if(a.image){ pv.style.display='block'; pv.innerHTML=`<img src="${a.image}" alt="预览">`; }
  else { pv.style.display='none'; pv.innerHTML=''; }
  document.getElementById('achModalTitle').textContent='编辑成果';
  document.getElementById('achModal').classList.add('show');
}
function closeAchEditor(){ document.getElementById('achModal').classList.remove('show'); editingAchId=null; pendingAchImage=null; }

/* 图片压缩：最长边 1280，JPEG 0.7 */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const sizeLevels=[1280,1024,800,640];
        const qLevels=[0.6,0.48,0.36,0.28];
        let best=null;
        for(const maxEdge of sizeLevels){
          let w=img.width,h=img.height;
          if(Math.max(w,h)>maxEdge){
            const k=maxEdge/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k);
          }
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          for(const q of qLevels){
            const out=c.toDataURL('image/jpeg',q);
            const bytes=Math.round((out.length-out.indexOf(',')-1)*3/4);
            best=out;
            if(bytes<=80*1024){ resolve(out); return; }
          }
        }
        resolve(best);
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function onAchImagePicked(ev){
  const file = ev.target.files[0];
  if(!file) return;
  try{
    pendingAchImage = await compressImage(file);
    const pv = document.getElementById('aPreview');
    pv.style.display='block';
    pv.innerHTML = `<img src="${pendingAchImage}" alt="预览">`;
  }catch(e){ toast('图片读取失败，请换一张'); }
  ev.target.value='';
}

function saveAchievement(){
  const text = document.getElementById('aText').value.trim();
  if(!text && !pendingAchImage){ toast('写点文字或选一张照片'); return; }
  if(editingAchId){
    const a = state.achievements.find(x=>x.id===editingAchId);
    if(a){ Object.assign(a,{text,image:pendingAchImage}); }
  }else{
    state.achievements.push({id:uid(), time:Date.now(), text, image:pendingAchImage});
  }
  persistLocal(); render(); closeAchEditor();
  toast('已保存到成果墙');
}

/* ---------- 成果三点菜单 ---------- */
function openAchSheet(id){ sheetAchId = id; document.getElementById('achSheet').classList.add('show'); }
function closeAchSheet(){ sheetAchId=null; document.getElementById('achSheet').classList.remove('show'); }
function editAchievement(){
  const id = sheetAchId; closeAchSheet(); openAchEditorForEdit(id);
}
function deleteAchievement(){
  if(!sheetAchId) return;
  state.achievements = state.achievements.filter(x=>x.id!==sheetAchId);
  persistLocal(); render(); closeAchSheet(); toast('已删除');
}

function openLightbox(id){
  const a = state.achievements.find(x=>x.id===id);
  if(!a) return;
  const body = document.getElementById('lbBody');
  if(a.image){ body.innerHTML = `<img src="${a.image}" alt="成果大图">`; }
  else { body.innerHTML = `<div class="lb-text">${esc(a.text)}</div>`; }
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(ev){
  if(ev && ev.target.closest('.lb-close')){ ev.stopPropagation(); }
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lbBody').innerHTML='';
}

/* ============================================================
   导航
   ============================================================ */
const NAV_META = {
  tasks:    { add:()=>openEditor(null),    sortable:true, history:true },
  rewards:  { add:()=>openRewardEditor(null), sortable:true, history:true },
  wall:     { add:()=>openAchEditor(),     sortable:false, history:false },
  goals:    { add:()=>openGoalEditor(null), sortable:false, history:false },
  settings: { add:null,                    sortable:false, history:false }
};

function switchNav(nav){
  currentNav = nav;
  sortMode = false;
  renderCoin();
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.nav===nav));
  document.getElementById('view-tasks').style.display = nav==='tasks'?'flex':'none';
  document.getElementById('view-rewards').style.display = nav==='rewards'?'flex':'none';
  document.getElementById('view-wall').style.display = nav==='wall'?'flex':'none';
  document.getElementById('view-goals').style.display = nav==='goals'?'flex':'none';
  document.getElementById('view-settings').classList.toggle('show', nav==='settings');
  const addBtn = document.getElementById('headAdd');
  if(NAV_META[nav].add){ addBtn.style.display='flex'; addBtn.onclick = NAV_META[nav].add; }
  else { addBtn.style.display='none'; }
  const sortBtn = document.getElementById('sortBtn');
  sortBtn.style.display = NAV_META[nav].sortable?'flex':'none';
  sortBtn.style.opacity = '1';
  document.getElementById('histBtn').style.display = NAV_META[nav].history?'flex':'none';
  if(nav==='tasks') renderTasks();
  else if(nav==='rewards') renderRewards();
  else if(nav==='wall') renderWall();
  else if(nav==='goals') renderGoals();
}

function toggleSortMode(){
  sortMode = !sortMode;
  const sortBtn = document.getElementById('sortBtn');
  sortBtn.style.opacity = sortMode?'.75':'1';
  if(currentNav==='tasks') renderTasks();
  else if(currentNav==='rewards') renderRewards();
  toast(sortMode?'排序模式：点上下箭头调整，再点排序退出':'已退出排序');
}

/* ---------- 历史记录（已完成任务 / 已兑换奖励，可逐条撤销） ---------- */
let histKind = 'task';
function openHistory(){
  histKind = currentNav==='rewards' ? 'reward' : 'task';
  document.getElementById('historyTitle').textContent = histKind==='reward' ? '已兑换奖励' : '已完成任务';
  renderHistory();
  document.getElementById('historyModal').classList.add('show');
}
function closeHistory(){ document.getElementById('historyModal').classList.remove('show'); }
function renderHistory(){
  const list = document.getElementById('historyList');
  const rows = state.history.filter(x=>x.kind===histKind);
  if(rows.length===0){
    list.innerHTML = '<div class="hist-empty">暂无' + (histKind==='reward'?'兑换':'完成记录') + '<br>完成任务 / 兑换奖励后会记在这里</div>';
    return;
  }
  list.innerHTML = rows.map(r=>{
    if(r.kind==='reward'){
      const s = r.snapshot||{};
      return `<div class="hist-row">
        <div class="hist-main">
          <div class="hist-title">${esc(s.title||'奖励')}</div>
          <div class="hist-meta">${fmtTime(r.time)}</div>
        </div>
        <span class="hist-coins minus">-${r.refundCoins}</span>
        <button class="hist-undo" onclick="undoHistoryRecord('${r.id}')">撤销</button>
      </div>`;
    }
    const s = r.snapshot||{};
    return `<div class="hist-row">
      <div class="hist-main">
        <div class="hist-title">${esc(s.title||'任务')}</div>
        <div class="hist-meta">${TYPE_NAME[s.type]||''} · ${fmtTime(r.time)}</div>
      </div>
      <span class="hist-coins plus">+${r.addedCoins}</span>
      <button class="hist-undo" onclick="undoHistoryRecord('${r.id}')">撤销</button>
    </div>`;
  }).join('');
}
function undoHistoryRecord(id){
  const r = state.history.find(x=>x.id===id);
  if(!r) return;
  undoRecord(r);
  renderHistory();
  toast('已撤销这条记录');
}

/* ---------- 撤销条 ---------- */
let undoTimer = null;
function showUndoBar(){
  const bar = document.getElementById('undoBar');
  const last = undoStack[undoStack.length-1];
  if(last.kind==='reward'){
    document.getElementById('undoText').textContent = '奖励兑换，-' + last.refundCoins + ' 金币';
  }else{
    document.getElementById('undoText').textContent = '任务完成，+' + last.addedCoins + ' 金币';
  }
  bar.classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(hideUndoBar, 6000);
}
function hideUndoBar(){ document.getElementById('undoBar').classList.remove('show'); }

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ============================================================
   坚果云 WebDAV 同步
   ============================================================ */
function getDav(){
  try{ return JSON.parse(localStorage.getItem(DAV_KEY)||'{}'); }catch(e){ return {}; }
}
function saveDavConfig(){
  const cfg = {
    url: document.getElementById('davUrl').value.trim(),
    user: document.getElementById('davUser').value.trim(),
    pass: document.getElementById('davPass').value.trim()
  };
  if(!cfg.url || !cfg.user || !cfg.pass){ toast('三项都填写后再保存'); return; }
  localStorage.setItem(DAV_KEY, JSON.stringify(cfg));
  toast('配置已保存');
  manualSync();
}
function fillDavForm(){
  const c = getDav();
  document.getElementById('davUrl').value = c.url||'';
  document.getElementById('davUser').value = c.user||'';
  document.getElementById('davPass').value = c.pass||'';
}
function authHeader(cfg){ return 'Basic ' + btoa(cfg.user + ':' + cfg.pass); }

async function cloudLoad(){
  const cfg = getDav();
  if(!cfg.url) throw new Error('未配置 WebDAV');
  const res = await fetch(cfg.url,{method:'GET',headers:{Authorization:authHeader(cfg)}});
  if(res.status===404) return null;
  if(!res.ok) throw new Error('读取失败 HTTP '+res.status);
  return await res.json();
}
async function cloudSave(){
  const cfg = getDav();
  if(!cfg.url) throw new Error('未配置 WebDAV');
  const res = await fetch(cfg.url,{
    method:'PUT',
    headers:{Authorization:authHeader(cfg),'Content-Type':'application/json'},
    body: JSON.stringify(state,null,2)
  });
  if(!res.ok) throw new Error('上传失败 HTTP '+res.status);
}
function scheduleCloudSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ cloudSave().then(()=>setStatus('已同步 '+new Date().toLocaleTimeString())).catch(err=>setStatus('同步失败：'+err.message)); }, 800);
}
async function manualSync(){
  setStatus('正在同步…');
  try{
    const remote = await cloudLoad();
    if(remote){
      state = Object.assign({coins:0,tasks:[],archive:[],rewards:[],achievements:[],history:[],goals:[]}, remote);
    }
    resetDueTasks();
    await cloudSave();
    persistLocal(); render();
    setStatus('同步成功 ' + new Date().toLocaleString());
    toast('同步完成');
  }catch(err){
    setStatus('同步失败：'+err.message);
    toast('同步失败：'+err.message);
  }
}
function setStatus(msg){ document.getElementById('syncStatus').textContent = msg; }

/* ---------- 导入 / 导出 ---------- */
function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '选题工作台备份-' + dayKey() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      state = Object.assign({coins:0,tasks:[],archive:[],rewards:[],achievements:[],history:[],goals:[]}, data);
      resetDueTasks(); persistLocal(); render(); toast('导入成功');
    }catch(e){ toast('文件格式错误'); }
  };
  reader.readAsText(file);
  ev.target.value='';
}
let clearArmed=false, clearArmedTimer=null;
function clearLocal(){
  const btn=document.getElementById('clearBtn');
  if(!clearArmed){
    clearArmed=true; btn.textContent='再点一次确认清空（不可恢复）';
    clearArmedTimer=setTimeout(()=>{ clearArmed=false; btn.textContent='清空本地全部数据'; },2600);
    return;
  }
  clearTimeout(clearArmedTimer); clearArmed=false; btn.textContent='清空本地全部数据';
  state = {coins:0,tasks:[],archive:[],rewards:[],achievements:[],history:[],goals:[]};
  persistLocal(); render(); toast('已清空');
}

loadLocal();
loadAppearance();
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));
document.querySelectorAll('#fontSeg button').forEach(b=>b.onclick=()=>setFont(b.dataset.font));
applyAppearance();
resetDueTasks();
bindTagPicker('fTag','fTagPicker');
bindTagPicker('gTag','gTagPicker');
bindTagPicker('rTag','rTagPicker');
render();
fillDavForm();
switchNav('tasks');
if(getDav().url){ manualSync(); }
